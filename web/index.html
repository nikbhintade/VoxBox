<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxBox</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <rect x="3.5" y="9" width="2.6" height="6" rx="1.3" fill="currentColor" />
            <rect x="8.2" y="4.5" width="2.6" height="15" rx="1.3" fill="currentColor" />
            <rect x="12.9" y="7" width="2.6" height="10" rx="1.3" fill="currentColor" />
            <rect x="17.6" y="10" width="2.6" height="4" rx="1.3" fill="currentColor" />
          </svg>
          <span class="brand-name">VoxBox</span>
          <span class="brand-badge">Local</span>
        </div>

        <nav class="nav" id="sidebar-nav">
          <button class="nav-item active" data-tab="dictation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3m-3 0h6"/></svg>
            <span>Dictation</span>
          </button>
          <button class="nav-item" data-tab="notetaker">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>
            <span>Notetaker</span>
            <span class="nav-pill">Soon</span>
          </button>
          <button class="nav-item" data-tab="insights">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="13" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="11" rx="1"/><rect x="16" y="4" width="4" height="16" rx="1"/></svg>
            <span>Insights</span>
          </button>
          <button class="nav-item" data-tab="dictionary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 7h7M8 11h5"/></svg>
            <span>Dictionary</span>
          </button>
          <button class="nav-item" data-tab="snippets">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="7" r="2.5"/><circle cx="6" cy="17" r="2.5"/><path d="M20 5L8.2 15.2M20 19L12.5 12.5M8.2 8.8L11 11.2"/></svg>
            <span>Snippets</span>
          </button>
          <button class="nav-item" data-tab="style">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h10M9 6v12M14 11h6M17 11v7"/></svg>
            <span>Style</span>
          </button>
          <button class="nav-item" data-tab="transforms">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 4l5 5L8 21H3v-5L15 4z"/><path d="M5 4v3M3.5 5.5h3M18 14v3M16.5 15.5h3"/></svg>
            <span>Transforms</span>
          </button>
          <button class="nav-item" data-tab="scratchpad">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
            <span>Scratchpad</span>
          </button>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div class="engine-card" id="engine-status-card">
          <div class="engine-row">
            <span class="status-dot ready" id="status-dot"></span>
            <span class="engine-title" id="status-text">Ready</span>
          </div>
          <div class="engine-sub" id="status-sub">Hold Right Ctrl to dictate</div>
        </div>

        <button class="nav-item" id="btn-open-settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </button>
      </div>
    </aside>

    <!-- Main Surface -->
    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <span class="hotkey-chip" id="topbar-hotkey-chip">Hold <strong>Right Ctrl</strong></span>
        </div>
        <div class="topbar-right">
          <button class="icon-btn" id="btn-dictate-now" title="Start / Stop Dictation">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
          </button>
          <button class="icon-btn" id="btn-theme-toggle" title="Toggle Dark / Light Theme">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <button class="icon-btn" id="btn-topbar-settings" title="Settings">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </header>

      <main class="canvas" id="main-canvas">
        <!-- Dynamically rendered views -->
      </main>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-backdrop hidden" id="settings-modal">
    <div class="settings-dialog" role="dialog" aria-modal="true">
      <aside class="settings-nav">
        <div class="settings-nav-label">SETTINGS</div>
        <button class="settings-nav-item active" data-stab="general">General</button>
        <button class="settings-nav-item" data-stab="models">Speech Models</button>
        <button class="settings-nav-item" data-stab="system">System</button>
        <button class="settings-nav-item" data-stab="notetaker">Notetaker</button>
        <button class="settings-nav-item" data-stab="privacy">Data &amp; Privacy</button>
        <div class="settings-version">VoxBox v0.2.0 · 100% Local</div>
      </aside>
      <section class="settings-body">
        <div class="settings-header">
          <h2 class="serif-title" id="settings-title">General</h2>
          <button class="icon-btn" id="btn-close-settings" title="Close">✕</button>
        </div>
        <div class="settings-content" id="settings-content"></div>
      </section>
    </div>
  </div>

  <!-- Generic Input Modal (Add Word / Snippet / Transform / Import) -->
  <div class="modal-backdrop hidden" id="form-modal">
    <div class="form-dialog" role="dialog" aria-modal="true">
      <div class="settings-header">
        <h3 class="serif-title" id="form-modal-title">Add Item</h3>
        <button class="icon-btn" id="btn-close-form">✕</button>
      </div>
      <div id="form-modal-body"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast hidden" id="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
